
devMode:   true             # show new ui elems that are in dev (dev menu)
showDim:   false            # show dimensions in food list and details
tryDesign: false            # try new UI (see controller.php)
# moved demo data to layout_demo

defaultUser: "JaneDoe@example.com-24080101000000"

substances:                 # TASK: maybe move in nutrients
                            # TASK: rename
  gluten:  ['weizen']
  lactose: ['milch']

highIntake:                 # TASK: maybe move in nutrients

  fat: 100

charts:                     # nutrition charts (integrated from reports/diagr)

  avg:       7              # period average, in days
  movingAvg: 7              # moving average window, in days

  limits:
    eatingTime: 6           # in hours
    calories:   2200        # kcal
    fat:
    carbs:      130
    amino:      60
    salt:       5
    price:      7           # EUR

agent:                      # AI voice agent (Gemini Live), see dev_info/Voice_Agent_Plan.md

  enabled: true             # false hides the mic button in sidebar and bottom nav
  model:   "gemini-3.1-flash-live-preview"
  voice:   "Aoede"          # Gemini Live prebuilt voice
  debug:   false            # verbose console logging, keeps errors on screen

photoImport:                # create a food from pictures of the packaging (Gemini vision)

  enabled:   true           # false hides the camera button in the new entry modal
  model:     "gemini-3.6-flash"   # must support generateContent - the Live model above does't
  maxImages: 3              # front, nutrition table, ingredients
  maxEdge:   1568           # px, the browser downscales to this before uploading
  quality:   0.82           # jpeg quality of the downscaled upload
  debug:     false          # log the received image sizes and the raw model answer

defaultSettings:            # see also users > settings.yml

  currency:       "EUR"     # currently EUR or USD
  currencySymbol: "&euro;"  # icon is a little nicer
  currencyIcon:   "bi-currency-euro"  # bi-currency-dollar
  cheap:          0.40      # per 100 g or ml
  expensive:      0.80

  foods:

    defaultAmounts:
      
      pack:   ["1/4", "1/3", "1"]
      pieces: [1, 2, 3]
