key: f49da6acd2fbdea7
written: '2026-08-25 19:39:34'
data:
  advice:
    summary: 'In den letzten Wochen zeigen sich deutliche Defizite bei Ballaststoffen, Kalium, Calcium sowie verschiedenen Vitaminen und Mineralstoffen. Einige Aminosäuren und durch Präparate zugeführte Vitamine liegen hingegen über dem Zielbereich. Durch eine genauere Erfassung unvollständiger Einträge lässt sich die Datenlage verbessern.'
    dataNotes:
      - 'Eine Hinterlegung von Nährwertprofilen für Quark R, Duplo und Frosta Gesch würde die Messgenauigkeit der Tageswerte stark erhöhen.'
    deficits:
      -
        nutrient: Fibre
        comment: 'Die tägliche Ballaststoffzufuhr liegt deutlich unter dem Zielwert.'
      -
        nutrient: Potassium
        comment: 'Die Kaliumaufnahme erreicht nicht den empfohlenen Bereich.'
      -
        nutrient: Calcium
        comment: 'Der Calciumwert liegt unter der angestrebten Tagesmenge.'
      -
        nutrient: 'Vitamin A'
        comment: 'Die Zufuhr von Vitamin A fällt im Monatsdurchschnitt gering aus.'
      -
        nutrient: Iron
        comment: 'Die Eisenwerte liegen unter der empfohlenen Zufuhr.'
      -
        nutrient: Zinc
        comment: 'Die Zinkversorgung erreicht den Zielbereich aktuell nicht.'
    excesses:
      -
        nutrient: Histidine
        comment: 'Der Wert liegt vor allem durch Linseneintopf R, Thunf pikant N und Bergkäse R Bio über dem Zielbereich.'
      -
        nutrient: 'Vitamin C'
        comment: 'Die erhöhte Zufuhr stammt hauptsächlich aus dem Präparat Vit C Abtei M.'
      -
        nutrient: 'Vitamin B12'
        comment: 'Der Wert liegt bedingt durch B-Vitamin-Präparate über dem empfohlenen Bereich.'
      -
        nutrient: Magnesium
        comment: 'Die Zufuhr liegt vor allem durch das Präparat Magn N über dem Zielwert.'
    recommended:
      -
        food: 'Linsen R Bio'
        amount: 1/3
        because:
          - Fibre
          - Iron
          - Potassium
          - Zinc
        comment: 'Liefert reichlich Ballaststoffe, Eisen und Kalium aus pflanzlicher Quelle.'
      -
        food: 'Brokkoli R'
        amount: 50g
        because:
          - Fibre
          - 'Vitamin K'
          - Potassium
        comment: 'Bringt wertvolles Vitamin K und Ballaststoffe in den Speiseplan.'
      -
        food: 'Sauerk Heng'
        amount: 1/4
        because:
          - Fibre
          - 'Vitamin K'
          - Potassium
        comment: 'Ergänzt Ballaststoffe und Kalium durch fermentiertes Gemüse.'
      -
        food: Avocado
        amount: '2'
        because:
          - Fibre
          - Potassium
          - 'Vitamin B6'
        comment: 'Liefert gesunde Fette, reichlich Kalium und Ballaststoffe.'
      -
        food: Pistazien
        amount: 50g
        because:
          - Potassium
          - Iron
          - 'Vitamin B6'
        comment: 'Gute Quelle für Kalium, Eisen und B-Vitamine als pflanzlicher Snack.'
      -
        food: 'Hähnchenbr Spr'
        amount: 100g
        because:
          - Leucine
          - 'Niacin B3'
          - Zinc
        comment: 'Deckt essenzielle Aminosäuren und Niacin ohne Milchprodukte.'
