#
# Carbs
#

# TASK: add these substances, the sugar sum needs a field in the day entries first
#       (like fibre, see MainController.updSummary)

# Glucose:
# Fructose:        
# Sucrose:         
# Starch:          

name:        Carbs
short:       carbs
unit:        g
defaultUnit: g
sources:

  - title: ""

amounts:

  - criteria: { gender: "*", age: "*", height: "*", weight: "*" }
    lower:  0
    amount: 80
    upper:  130

substances:

  Sugar:  # the food data holds the total sugars from the packaging

    short:  sugar
    # unit: g

    amounts:

      - criteria: { gender: male, age: 40, height: "*", weight: 75 }
        lower:  0
        amount: 0   # free sugars, see the goals in the bundle (avoid sugar)
        upper:  25  # tolerance: the food data is total sugars, WHO says 5% of the
                    # energy for free sugars (~27g of 2200 kcal)

  Fibre:  # technically fibre is complex carb, but can't be used by the body (harvard)

    short:  fibre
    # unit: g

    amounts:

      - criteria: { gender: male, age: 40, height: "*", weight: 75 }
        lower:  25  # TASK: by AI
        amount: 40  # 30-38
        upper:  50  # diabetes control  AI says 2 kcal per g
