# Abstract concept

# framework     = a single idea that you can use for doing the right thing
# miscImportant = misc important things 2 do

framework: |

  Avoid all mass produced food that humans weren't meant to eat ([2](#ref2)),
  prefer what evolution made use for before invention of agriculture
  (6-15k years is no long time).

conceptMisc: |

  ::: fold Foods to use

  ::: note
  Food list is made in a way so that these foods can easily be chosen
  :::

  |   |   |
  | --- | --- |
  | **Avoid** | Alcohol, sugar, bread, all corn and cereals (high sugar spikes), all processed foods (eat clean) ([2](#ref2)), all milk products |
  | **Limit** | Only a few fruits (good substances but too much fructose), starches (no fries ;-), eggs, joghurt, TASK: fermented like sauerkraut ? |
  | **Plants** | Legumes (complex carbs: chickpeas, lentils, beans), vegetables, leafy greens, some nuts and seeds daily, few herbs ([3](#ref3)) |
  | **Meat** | Seems to be necessary, currently (fatty) fish and chicken (maybe daily) ([2](#ref2)) TASK: blue zones how much amino get older from fish, pork? |
  | **Misc** | Garlic, olive oil daily, 1-2 coffee, cocoa or low sugar chocolate ([3](#ref3)) |
  | **Fun** | Menu includes one cheat day per week as well as "micro candy" daily (tiny piece only or sugar-free) |

  :::

# Primary goals

# TASK: Fibre, salt
goals: |

  - Change some food daily, don't use too much of one on a daily basis
    "it's about balance" ([1](#ref1))
  - ~3l water daily [(use a jug)](tab:tipsNutritionPane/tipsTrackWater)
  - **Fastening days:** Use limited fastening as a tool to simulate food shortage and
    activate survival mechanisms ([1](#ref1)), e.g. try to eat no longer than 4-6 hours
    ("eat less often"), means: eat all meals at once.
    **Or:** calories reduced ~1800 kcal for a couple of days.
  - **Fill up energy:** Also have days with more food to fill up (just in case) ~2500 kcal,
    **Winter:** Limited carbs may help, so the body can heat up (corn)
  - **Amino acids:** maintain muscle may need: 1.6 (most say: 0.8), gain muscle: 1.8 or
    2.0 - 2.2g per kg weight, **Magnesium:** more if sports
  - **Fibre (sources):** Almonds (12g), Lentils (8g), Chickpeas (~12g), Broccoli, Kidney (15-25g)
  - **On the go** the best food that is available is used

# Sample for how primary goals can be done

