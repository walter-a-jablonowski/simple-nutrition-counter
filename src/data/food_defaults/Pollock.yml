
# GLM only

# 2608 verified all values from source as far as active in /nutrients
#      The bundle food (Seelachs N, Norma "Alaska-Seelachs", 75 kcal, 0.8 g fat,
#      17 g protein) does not state its state - no productName, no comment, only
#      vendor, weight, pack values and cookingInstructions ">= 12 min" (i.e. it
#      is sold uncooked). So no state is claimed for the product here.
#      Entries weighed:
#        2768188 Foundation "Alaska Pollock, raw"     78 kcal, 100 values (used)
#        173725  SR Legacy  "Fish, pollock, Alaska, raw"  76 kcal, 45 values
#        173726  SR Legacy  "Fish, pollock, Alaska, cooked" 86.6 kcal
#      The pack's 75 kcal sit next to the raw entries (76/78), well below cooked
#      (86.6), and 2768188 is the fullest panel by far (amino acids, vitamins,
#      fatty acids, iodine, selenium - none of which 173725 carries), so it is
#      used as the single source. 173725 is cited as the unused alternative.
#
#      Source has no Atwater Specific (only Atwater General = 78), no Vitamin K,
#      no Vitamin C, no Biotin, no Fluoride, no Chromium, no Molybdenum, no
#      sugar alcohol and no "Sugars, total" (the five single sugars are all
#      0.00); these stay 0. 173725 has none of them either.

