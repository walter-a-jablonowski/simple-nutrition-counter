sources:

  - title:   Default source = Lentils, mature seeds, cooked, boiled, without salt (SR Legacy)
    comment: most complete panel of the lentil entries (96 nutrients, incl. amino acids)
    source:  https://fdc.nal.usda.gov/food-details/172421/nutrients

  - title:   Alternative = Lentils, from canned (FNDDS, unused)
    comment: closer to the tinned products, but no amino acids (65 nutrients)
    source:  https://fdc.nal.usda.gov/food-details/2707426/nutrients

  - title:   Alternative = Lentils, dry (Foundation, unused)
    comment: analytical, but dry basis and only 22 nutrients
    source:  https://fdc.nal.usda.gov/food-details/2644283/nutrients

