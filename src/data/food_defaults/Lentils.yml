
# AI-only

# 2607 verified all values from source as far as active in /nutrients
#      Basis is cooked (boiled, drained), because both bundle foods that use this
#      type are canned lentils. The source is drained, the tinned products carry
#      their liquid (89 kcal on the pack vs 116 here), so their micronutrients
#      come out a bit high - the food's own values win for kcal and macros anyway.
#
#      Source has no Atwater variants and no iodine, fluoride, chromium,
#      molybdenum, biotin; these stay 0. Sugar alcohol is not in the source.

acceptable:
comment:
                              # kcal
calories:          116        # Energy, SR Legacy has no Atwater Specific/General

nutritionalValues:            # g

  fat:             0.38       # total lipid (fat)
  saturatedFat:    0.053
  monoUnsaturated: 0.064
  polyUnsaturated: 0.175
  carbs:           20.13      # by difference
  sugar:           1.8        # total sugars
  sugarAlcohol:    0
  fibre:           7.9
  amino:           9.02       # is protein
  salt:            0.002      # Sodium 2 mg -> g, as in Butter and Chickpeas
                              # (NaCl would be x 2.5; food value overrides this anyway)
fattyAcids:                   # g, but EPA and DHA in mg

  Alpha-linolenic acid: 0.037 # PUFA 18:3
  Eicosapentaenoic acid: 0    # PUFA 20:5 n-3 (EPA), missing in _blank_ai.yml
  Docosahexaenoic acid: 0     # PUFA 22:6 n-3
  Linoleic acid:        0.137 # PUFA 18:2

carbs:                        # g

  Fibre:         7.9          # substance is "Fibre", _blank_ai.yml writes "Fiber"

aminoAcids:                   # mg
                              # source in g
