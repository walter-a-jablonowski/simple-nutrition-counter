
# GLM only

# 2607 verified all values from source as far as active in /nutrients
#      The food (Rewe Bio "Gemüse R Bio 2") does not state its state - the file
#      carries only vendor, weight and pack values, no productName/comment. It is
#      a frozen Mediterranean mix (zucchini 25%, broccoli 20%, carrots, cherry
#      tomatoes, onions + sunflower/olive oil), pack 43 kcal, fat 2.3, carbs 3.3,
#      fibre 1.9, protein 1.4, salt 0.71.
#
#      USDA has no Mediterranean mix; the "Vegetables, mixed" entries are the
#      corn/lima beans/peas/green beans/carrots mix, with no oil. The three frozen
#      neighbours were weighed:
#        170471 frozen, unprepared              77 values, 72 kcal, fat 0.52
#        170472 frozen, cooked, boiled, drained, without salt  90 values, 65 kcal, fat 0.15  <- used
#        170142 frozen, cooked, boiled, drained, with salt     80 values, 65 kcal, fat 0.15
#      170472 was taken: it is the fullest entry (carries amino acids, vitamins
#      and fatty acids in full, so no step 2b needed) and its kcal (65) is the
#      closest to the pack. The pack still runs lower in carbs/kcal and higher in
#      fat than the source, because the Mediterranean watery veg is lower carb
#      than corn/lima and the bag adds oil - the food's own values win for kcal
#      and macros anyway.
#
#      Source has no Atwater Specific/General (plain Energy only), no iodine,
#      fluoride, chromium, molybdenum, biotin; these stay 0. Sugar alcohol is not
#      in the source.

