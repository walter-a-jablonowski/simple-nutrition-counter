
# AI-only

# 2609 verified all values from source as far as active in /nutrients
#      The food (REWE Bio Gemüsemais, 230 g glass jar) does not state whether
#      the pack values are for drained corn or for solids and liquids. Two
#      entries were weighed:
#        169214  yellow, canned, whole kernel, drained solids   67 kcal, protein 2.29, fat 1.22, fibre 2.0
#        170409  yellow, canned, brine pack, solids and liquids 61 kcal, protein 1.95, fat 0.77, fibre 1.7
#      The pack says 64 kcal, protein 2.3, fat 1.5, fibre 2.2; the protein
#      (2.3 vs 2.29) matches 169214 almost exactly, so the drained solids entry
#      was taken. The food's own values win for kcal and macros anyway.
#
#      Source has no Atwater Specific/General energy (plain Energy only), no
#      iodine, chromium, molybdenum, biotin; these stay 0. Sugar alcohol is not
#      in the source. Fluoride is not in 169214 but is in 170409 (0.018 mg),
#      taken from there per step 2b.3.

