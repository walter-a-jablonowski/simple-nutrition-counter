#      pack values. Both entries are "Oil, canola" with no state distinction.
#      SR Legacy 172336 chosen as primary: 31 non-zero values, incl. calories
#      (884 kcal), vitamins E and K, and full fatty acid panel.
#      Foundation 748278 is analytical but very sparse: only fat (NLEA),
