
# AI-only

# 2608 verified all values from source as far as active in /nutrients
#      The foods do not label a state. R Rüben R Bio lists its ingredients
#      (water, beet sugar, brandy vinegar, sea salt, caraway, cloves), i.e.
#      pickled in vinegar with added sugar; R Rüben N carries no ingredients,
#      only vendor, weight and the pack values. Both come in a glass jar at
#      55 and 59 kcal with 0.6-1.2 g salt.
#      Weighed every beet entry: pickled 170480 (65 kcal, 96 values) is the
#      fullest and the closest to the packs; harvard 170479 (73 kcal, 62
#      values) is higher and sparser; plain canned 169147 / 169966 / 168507
#      (28-31 kcal) and raw / cooked 169145 / 169146 / 168506 (43-44 kcal)
#      sit well below the packs. Took 170480.
#      The packs are saltier than the source (1.2 / 0.6 g vs 0.149 g here) -
#      the food's own salt value overrides this anyway.
#
#      Source has no Atwater variants, no sugar alcohol, no iodine, fluoride,
#      chromium, molybdenum and no biotin; these stay 0. EPA and DHA are 0 in
#      the source. 170480 is a complete SR Legacy entry (all amino acids,
#      vitamins except biotin, fat breakdown and fatty acids), so no second
#      entry is needed.

