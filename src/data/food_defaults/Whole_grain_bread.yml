
# GLM only

# 2608 verified all values from source
#      The foods do not state their state - only vendor, weight and pack values.
#      Weighed 168013 "Bread, multi-grain (includes whole-grain)" (SR Legacy,
#      265 kcal, 73 values, incl. amino acids) against 172688 "Bread, whole-wheat,
#      commercially prepared" (SR Legacy, 252 kcal, 83 values but no amino acids
