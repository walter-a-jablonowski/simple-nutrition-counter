
# GLM only

# 2608 verified all values from source as far as active in /nutrients

#      The food "Sellerie R Bio" does not state its state (raw / cooked). It is
#      pickled celery (ingredients: SELLERIE, Wasser, Branntweinessig, Rübenzucker,
#      Meersalz), so the celery itself is raw - the 44 kcal on the pack come from
#      the added beet sugar, not from cooking. Weighed the raw entries against the
#      cooked ones:
#        2346405 Foundation "Celery, raw"          15-17 kcal,  19 values
#        169988  SR Legacy  "Celery, raw"          14 kcal,    ~90 values
#        169989  SR Legacy  "Celery, cooked, boiled, drained, without salt"  18 kcal, 100 values
#        169342  SR Legacy  "Celery, cooked, boiled, drained, with salt"     (not fetched, same state as 169989)
#      Took the raw entries: pickled celery is made from raw celery, and the pack
#      kcal (44) matches neither raw (14-17) nor cooked (18) because of the added
#      sugar. The cooked entries are cited as unused alternatives.
#
#      Default source (2346405, Foundation) is analytical but sparse: proximates
#      and minerals only, no fibre, no sugar, no fat breakdown, no amino acids, no
#      vitamins (except B-6), and Iron / Copper / Selenium / Molybdenum at 0.
#      Fat breakdown, fatty acids, amino acids, vitamins, fibre, sugar and the
#      minerals that are 0 in the Foundation are taken from the SR Legacy
#      "Celery, raw" (169988); see per-field comments and sources.
#      Note: 169988 has 0.69 g protein against the 0.49 g here, so its amino
#      acids run about 40 % high on this file's protein basis.
#      Source has no iodine, chromium, biotin, sugar alcohol; these stay 0.
#      Molybdenum: Foundation 2346405 carries 0.0 µg, SR Legacy 169988 has none.

