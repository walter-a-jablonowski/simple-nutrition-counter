
# GLM only

# 2608 verified all values from source as far as active in /nutrients
#      Basis is canned in water, without salt, drained solids (SR Legacy 171986,
#      116 kcal). The two bundle foods that use this type do not state their
#      state (no productName, no comment, only vendor, weight and pack values):
#        Thunf pikant N  104 kcal, 3.9 g fat, 10.8 g protein (spiced, has sauce)
#        Thunfisch N     156 kcal, 5.4 g fat, 27 g protein
#      The foods disagree on kcal (104 vs 156). 171986 at 116 kcal sits between
#      them; the 156 kcal food is well above both canned-in-water entries (90 and
#      116 kcal) and may be a richer variety, but the file does not say so.
#      171986 is used as primary because it is the fullest entry (amino acids,
#      vitamins, fatty acids, fluoride - 65 values) and the verification tool
#      can reach it. The Foundation entry 334194 (90 kcal, analytical) is retired
#      from the API and could not be verified; it supplies only Vitamin D.
#
#      Neither source has Vitamin E, Vitamin K, Biotin, Chromium, Molybdenum,
#      sugar alcohol or iodine (iodine is 0.0 in 334194); these stay 0.

