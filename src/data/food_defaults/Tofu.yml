
# GLM only

# 2607 verified all values from source as far as active in /nutrients
#      The food (Tofu N, Norma, 400 g) does not state its state - no productName,
#      no comment, only vendor, weight and the pack values (137 kcal, 8 g fat,
#      16.5 g protein, 0.7 g carbs). So no state is claimed here.
#      All USDA tofu entries are SR Legacy (no Foundation entry exists). The four
#      generic ones were weighed against the pack kcal:
#        172475  Tofu, raw, firm, prepared with calcium sulfate   144 kcal, 17.3 prot, 8.72 fat
#        172476  Tofu, raw, regular, prepared with calcium sulfate 76 kcal,  8.08 prot, 4.78 fat
#        172448  Tofu, firm, prepared with calcium sulfate and magnesium chloride (nigari)  78 kcal
#        172449  Tofu, soft, prepared with calcium sulfate and magnesium chloride (nigari)  61 kcal
#      172475 is the only one whose kcal and macros sit next to the pack, so it is
#      the default source. It is a full SR Legacy entry (amino acids, vitamins,
#      fatty acids all present), so no second entry is needed for those.
#      172475 carries no total sugars (269), no Vitamin E (323) and no Vitamin K
#      (430); these three are taken from 172476, the same "raw, prepared with
#      calcium sulfate" family (regular vs firm), and marked "# from 172476".
#      172475 has Vitamin A only as IU (318 = 166), not as RAE (320); the sibling
#      nigari entries 172448/172449 carry RAE = 0, so Vitamin A is 0.
#      No tofu entry has biotin, iodine, fluoride, chromium, molybdenum, sugar
#      alcohol, EPA, DHA, alcohol or caffeine; these stay 0 with "# not in source".
#      Source has no Atwater Specific/General energy, only plain Energy (208).

