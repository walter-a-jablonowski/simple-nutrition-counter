
# GLM only

# 2608 verified all values from source as far as active in /nutrients
#      Default source is Foundation 2259796 "Cheese, feta, whole milk, crumbled"
#      (analytical). It carries calories, macros, the full SFA/MUFA breakdown,
#      linoleic acid, minerals, water and most B vitamins + biotin + vitamin K,
#      but no amino acids, no total PUFA, no ALA/EPA/DHA, no fibre, no Vitamin A
#      RAE, no Vitamin E, no Vitamin C, no pantothenic acid, no folate, no
#      Vitamin B12, no selenium. Those fields are taken from the SR Legacy
#      sibling "Cheese, feta" (173420); see per-field comments and sources.
#
#      The two bundle foods do not state a state (only vendor, weight and pack
#      values): Patros W (278 kcal, fat 22, protein 19, salt 3) and Patros 150
#      (278 kcal, fat 24, protein 15, salt 3). Both are Rewe "Patros" feta,
#      salt 3 g marks them salted. The two USDA entries were weighed:
#        - Foundation 2259796 "whole milk, crumbled": 273 kcal, fat 19.1,
#          protein 19.7 - closer to the pack kcal (278) and analytical, taken.
#        - SR Legacy 173420 "Cheese, feta": 265 kcal, fat 21.5, protein 14.2 -
#          fuller panel (amino acids, vitamins, PUFA), used to fill the gaps.
#      Patros 150's protein (15) sits closer to the SR Legacy entry, Patros W's
#      protein (19) to the Foundation entry; flagged here so it can be decided
#      by someone who knows the products. The food's own values win for kcal
#      and macros anyway.
#
#      Protein basis: Foundation 2259796 has 19.7 g protein, SR Legacy 173420
#      has 14.2 g, so the amino acids taken from 173420 run about 28 % low on
#      the file's own 19.7 g basis (the two entries are noticeably different
#      cheeses - 173420 is the only SR Legacy feta, so it is the best fill
#      available; much better than zeros for a 19.7 g protein food).
#
#      Sugar is nutrient 269.3 ("Sugars, Total") in this Foundation entry, not
#      269, so the verifier has no number to match it against - the value 1.63
#      is straight from the source (lactose 0.61 + glucose 0.59 + galactose
#      0.43). SR Legacy reports total sugars as 0, which is wrong for a cheese
#      with 5.58 g carbs, so the Foundation value is kept.
#
#      No entry carries fluoride, chromium, molybdenum or sugar alcohol; these
#      stay 0 (# not in source). EPA and DHA are 0 in 173420.

