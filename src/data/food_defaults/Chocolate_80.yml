
# GLM only

# 2608 verified all values from source as far as active in /nutrients
#      The food (Ritter Sp 81%) does not state its state - it only carries vendor,
#      weight and the pack values. Weighed 170273 (Chocolate, dark, 70-85% cacao
#      solids, SR Legacy, 598 kcal, 105 values), 170271 (45-59% cacao, no amino
#      acids), 170272 (60-69% cacao, no amino acids) and 167976 (Candies,
#      semisweet chocolate, SR Legacy, 480 kcal, has amino acids). Took 170273:
#      it covers the 70-85% cacao range that includes 81%, and its 598 kcal sit
#      closest to the pack's 609.
#
#      170273 has no amino acids despite 7.79 g protein, and no folate, biotin,
#      Vitamin C, Vitamin D, iodine, fluoride, chromium, molybdenum. Amino acids
#      and folate are taken from 167976 (Candies, semisweet chocolate, SR Legacy);
#      see per-field comments and sources. 167976 has 4.20 g protein against the
#      7.79 g here, so its amino acids run about 46 % low on this file's protein
#      basis. Vitamin C and D are 0 in 167976.
#      Sugar alcohol, biotin, iodine, fluoride, chromium and molybdenum are in
#      neither entry; these stay 0.

