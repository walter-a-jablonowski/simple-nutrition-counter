# used: https://fdc.nal.usda.gov/food-details/2346385/nutrients

# 2608 verified all values from source as far as active in /nutrients
#      Default source is Foundation 2346385 "Cream cheese, full fat, block"
#      (analytical). It is sparse: it carries calories, macros, minerals, water
#      and a few vitamins, but no amino acids, no sugar, no fibre, no total PUFA,
#      no ALA/EPA/DHA, no Vitamin A RAE, no Vitamin E, no riboflavin, no
#      pantothenic acid, no folate, no selenium, and it reports iron, copper and
#      manganese as 0. Those fields are taken from the SR Legacy sibling
#      "Cheese, cream" (173418); see per-field comments and sources.
#
#      The two bundle foods disagree and neither states a state (only vendor,
#      weight and pack values):
#        - Frischk R Bio  = "REWE Bio Körniger Frischkäse" (granular fresh
#          cheese), 91 kcal, fat 4, protein 12.7 - this matches the neighbour
#          2346384 "Cottage cheese, full fat" (103 kcal, fat 4.22, protein
#          11.6), not the cream cheese block.
#        - Frischk R Bio 2 = "REWE Bio Frischkäse Doppelrahmstufe" (double
#          cream cheese spread), 268 kcal, fat 26, protein 5.4 - this matches
#          2346385 (337 kcal, fat 33.5, protein 5.79).
#      The type is anchored to 2346385, so the file follows the full-fat block
#      entry. Food 1 is a granular low-fat product that sits closer to cottage
#      cheese; flagged here so it can be decided by someone who knows the
#      products. The food's own values always win for kcal and macros anyway.
#
#      Protein basis: Foundation 2346385 has 5.79 g protein, SR Legacy 173418
#      has 6.15 g, so the amino acids taken from 173418 run about 6 % high on
#      the file's own basis.
#
#      No entry carries fluoride, chromium, molybdenum or sugar alcohol; these
#      stay 0 (# not in source). Vitamin D and Vitamin C are 0 in 173418.

