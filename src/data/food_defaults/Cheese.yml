# 2608 verified all values from source as far as active in /nutrients
#      The foods do not state a state (raw/cooked/canned/dry) - they only carry
#      vendor, weight and pack values. Cheese is not described that way, so no
#      state is claimed. Weighed the two "Cheese, swiss" entries against each
#      other: Foundation 746767 (the designated basic data, 19 values, analytical
#      proximates + minerals) and its SR Legacy sibling 171251 (136 values, adds
#      energy, fibre, fat breakdown, fatty acids, amino acids, vitamins and
#      selenium). 746767 is used for proximates and minerals, 171251 fills every
#      gap. Both entries agree on protein (27.0 g), so the amino acids run on the
#      file's own basis.
#
#      Source has no iodine, fluoride, chromium, molybdenum, biotin; these stay 0.
#      Sugar alcohol is not in the source. Vitamin D and Vitamin C are 0 in 171251.

