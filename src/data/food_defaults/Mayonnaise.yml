
# GLM only

# 2608 verified all values from source as far as active in /nutrients
#      The food "Majo Thomy" does not state its state - it only carries vendor,
#      weight and pack values (705 kcal, 77.5 g fat, 0.8 g salt). It is a regular
#      mayonnaise (80% sunflower oil, egg yolk, vinegar, mustard). There is no
#      raw/cooked/canned/dry distinction for mayonnaise.
#
#      Default source (2758986, Foundation "Mayonnaise, Regular") is analytical
#      but extremely sparse: it carries only water, ash, the full fatty acid
#      breakdown, riboflavin, B6 and choline. It has no calories, no total fat,
#      no protein, no carbs, no fibre, no sugar, no sodium, no minerals, no amino
#      acids and no other vitamins. The SR Legacy "Salad dressing, mayonnaise,
#      regular" (171009, 135 values) fills all those gaps; see per-field comments
#      and sources. 2758986 has no protein, so the amino acids (from 171009,
#      0.96 g protein) match their own protein basis exactly.
#
#      Weighed against 171010 "mayonnaise, soybean and safflower oil, with salt"
#      and 171418 "mayonnaise, soybean oil, without salt" - both are narrower
#      oil-specific variants; 171009 is the canonical regular entry and the
#      fullest. The food's own salt (0.8 g) overrides the default anyway.
#
#      Neither entry has iodine, fluoride, chromium, molybdenum, biotin or sugar
#      alcohol; these stay 0.

